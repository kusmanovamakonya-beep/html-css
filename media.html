<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My books</title>
</head>
<body>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e8f5e9;
            margin: 0;
        }

        header{
            background-color: #2e7d32;
            color: white;
            text-align: center;
            padding: 30px;
        }

        header h1{
            font-size: 35px;
        }

        .box{
            background-color: White;
            width: 70%;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .box h2{
            color: #2e7d32;
        }

        .books{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 200px;
        }

        .book{
            background-color: #ffd166;
            padding: 20px;
            width: 150px;
            border-radius: 15px;
        }

        table{
            margin: auto;
            border-collapse: collapse;
            width: 80%;
        }
        th,td{
            border: 1px solid #2e7d32;
            padding: 12px;
        }

        th{
            background-color: #2e7d32;
            color: white;
        }

        td{
            background-color: #f1f8e9;
        }

        input{
            padding: 12px;
            margin: 5px;
            border: 2px solid #06d6a0;
            border-radius: 8px;
        }

        button{
            background-color: #118ab2;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
        }


        @media(max-Width:900px){
            .box{
                width: 85%
            }

            .books{
                flex-direction: row;
                flex-wrap: wrap;
            }
        }

        @media(max-width:600px){
            header{
                padding: 15px;
            }

            .box{
                width:95%;
                padding: 15px;
            }

            .books{
                width: 80%;
            }

            input{
                width: 80%;
            }

            table{
                font-size: 14px;
            }
        }
    </style>
   <header>
    <h1>My book</h1>
    <p>My Favorite Books</p>
   </header> 

   <div class="box">
    <h2>My Favorite Books</h2>

    <div class="books">
    <div class="book">
        <h3>Harry Potter</h3>
        <p>Fantasy</p>
    </div>

    <div class="book">
        <h3>The Little Prince</h3>
        <p>Fantasy</p>
    </div>

    <div class="book">
        <h3>Wonger</h3>
        <p>Drama</p>
    </div>
     <div>
    </div>

    <div class="box">
        <h2>Book Rating</h2>

        <table>
            <tr>
                <th>Book</th>
                <th>Rating</th>
            </tr>

            <tr>
                <th>Harry Potter</th>
                <th>5/5</th>
            </tr>

            <tr>
                <th>The Little Prince</th>
                <th>5/5</th>
            </tr>

            <tr>
                <th>Wonder</th>
                <th>4/5</th>
            </tr>
        </table>
    </div>

    <div class="box">
        <h2>Add Your Favorite Book</h2>

        <form>
            <input type="text" placeholder="Book name">
            <input type="text" placeholder="Author">
            <br>
            <br>

            <button>Sumbit</button>
        </form>
    </div>
</body>
</html>
